<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afix Canisă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --surface-2:#E6EBE3; --ink:#14231D; --ink-2:#46564F; --ink-3:#7A8A82; --line:#DCE3D8;
  --accent:#1D4A3C; --accent-ink:#FFFFFF; --accent-soft:#DCE9E2;
  --gold:#B87A12; --gold-soft:#FBEBCB; --glow:#F2B54A;
  --bad:#C0412A; --bad-soft:#F8DFD6; --warn:#A5650A; --warn-soft:#F8E8CA; --ok:#2C7A4B; --ok-soft:#D9EEDF;
  --shadow:0 1px 2px rgba(20,35,29,.05),0 12px 32px -16px rgba(20,35,29,.28);
  --shadow-lg:0 2px 6px rgba(20,35,29,.06),0 28px 60px -24px rgba(20,35,29,.45);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C1411; --surface:#14201B; --surface-2:#1C2A24; --ink:#E9EFEB; --ink-2:#AFBDB6; --ink-3:#7F8F88; --line:#26352E;
  --accent:#8ED1B2; --accent-ink:#0A1A13; --accent-soft:#1A3329; --gold:#F2BC5C; --gold-soft:#3A2D14; --glow:#F2B54A;
  --bad:#F08E76; --bad-soft:#3C1F18; --warn:#E9B04F; --warn-soft:#3A2B10; --ok:#80CF9C; --ok-soft:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1411; --surface:#14201B; --surface-2:#1C2A24; --ink:#E9EFEB; --ink-2:#AFBDB6; --ink-3:#7F8F88; --line:#26352E;
  --accent:#8ED1B2; --accent-ink:#0A1A13; --accent-soft:#1A3329; --gold:#F2BC5C; --gold-soft:#3A2D14; --glow:#F2B54A;
  --bad:#F08E76; --bad-soft:#3C1F18; --warn:#E9B04F; --warn-soft:#3A2B10; --ok:#80CF9C; --ok-soft:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow:hidden}
body{overflow:hidden}
.app{height:100%}
.col{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
svg.i{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;line-height:1}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
main{padding:8px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1080px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0;cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .dot,.nav .dot{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}
@media (min-width:100000px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:22px;height:100%;overflow-y:auto;padding:26px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .topbar,.tabbar{display:none}
  main{padding:30px 36px 60px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left;position:relative}
  .nav button:hover{background:var(--surface-2)}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .nav .dot{position:static;margin-left:auto}
  .side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.ok{background:var(--ok)} .sync.err{background:var(--bad)}

/* headers */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.vh h1{font-family:var(--display);font-size:clamp(28px,5vw,38px);line-height:1.05;letter-spacing:-.01em}
.vh .sub{color:var(--ink-3);margin-top:4px}
.back{display:flex;align-items:center;gap:4px;background:var(--bg);border:0;color:var(--accent);font-weight:700;font-size:15px;padding:12px 0 10px;cursor:pointer;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;width:100%;text-align:left}
.back svg.i{width:22px;height:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn svg.i{width:17px;height:17px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel+.panel{margin-top:16px}
.panel h2,.sec-h h2{font-family:var(--display);font-size:21px;line-height:1.2}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:100000px){.grid2{grid-template-columns:1.25fr 1fr}}
.stack{display:flex;flex-direction:column;gap:12px}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;color:var(--ink)}
.banner p{max-width:62ch;font-size:14px}

.hello h1{font-family:var(--display);font-size:clamp(30px,5.6vw,44px);line-height:1.05;letter-spacing:-.015em;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 22px;color:var(--ink-2);font-size:14px}
.facts b{font-variant-numeric:tabular-nums;color:var(--ink)}

/* reminders */
.rems{display:flex;flex-direction:column}
.rem{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .stripe{align-self:stretch;border-radius:4px;background:var(--line)}
.rem.late .stripe{background:var(--bad)} .rem.today .stripe{background:var(--warn)} .rem.soon .stripe{background:var(--accent)}
.rem-title{font-weight:600;line-height:1.3}
.rem-sub{font-size:13px;color:var(--ink-3);margin-top:1px}
.rem-side{display:flex;align-items:center;gap:10px}
.rem-when{text-align:right;font-size:13px;line-height:1.25;font-variant-numeric:tabular-nums}
.rem-when b{display:block;font-weight:600}
.rem.late .rem-when b{color:var(--bad)} .rem.today .rem-when b{color:var(--warn)}
.rem-when small{color:var(--ink-3)}
@media all{.rem{grid-template-columns:4px 1fr}.rem-side{grid-column:2;justify-content:space-between;margin-top:8px}.rem-when{text-align:left}.rem-when b{display:inline;margin-right:6px}}
.empty{padding:22px 4px;color:var(--ink-3);text-align:center}
.empty.big{padding:40px 16px}
.empty.big h3{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:6px}

/* pregnancy + litters */
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink-3)}
.card h3{font-family:var(--display);font-size:20px;line-height:1.2;margin-top:2px}
.cardrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.count{text-align:right;line-height:1}
.count b{font-family:var(--display);font-size:34px;font-weight:400;font-variant-numeric:tabular-nums}
.count small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.track{position:relative;height:8px;border-radius:8px;background:var(--surface-2);margin:14px 0 8px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--accent)}
.track i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-3);border-radius:2px;opacity:.5}
.track i.past{background:var(--accent-ink);opacity:.8;top:1px;height:6px}
.collars{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.collar{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 18%,transparent);flex:none}
.collar.lg{width:22px;height:22px}

.milestones{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.milestones li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.milestones li:first-child{border-top:0}
.milestones .d{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-3);display:grid;place-items:center;background:none;cursor:pointer;padding:0;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:14px;height:14px}
.milestones li.done span.t{color:var(--ink-3);text-decoration:line-through}

/* dogs */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dogs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.dogcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--h);color:#fff;font-family:var(--display);font-size:26px;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.xl{width:112px;height:112px;font-size:46px}
.dogcard .nm{font-family:var(--display);font-size:22px;line-height:1.1}
.dogcard .rn{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dogcard .meta{font-size:13px;color:var(--ink-3);margin:2px 0 7px}
.sex{font-weight:700}
.sex.F{color:#B8467A} .sex.M{color:#3569B8}
:root[data-theme="dark"] .sex.F{color:#E88AB5} :root[data-theme="dark"] .sex.M{color:#86AEF0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sex.F{color:#E88AB5}:root:not([data-theme="light"]) .sex.M{color:#86AEF0}}

/* dog detail */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 18px}
.dhead h1{font-family:var(--display);font-size:clamp(32px,6vw,46px);line-height:1}
.dhead .rn{font-size:16px;color:var(--ink-2);margin-top:6px}
.dhead .pills{margin-top:10px}
.av-edit{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;position:relative}
.av-edit .cam{position:absolute;right:2px;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
@media all{.dhead{grid-template-columns:1fr;justify-items:start;gap:12px}.av.xl{width:92px;height:92px;font-size:38px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.cert{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:9px;pointer-events:none}
.cert-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;position:relative}
.cert-top h2{font-family:var(--display);font-size:24px;line-height:1.15}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 22px;margin:18px 0 0;position:relative}
.dl div{min-width:0}
.dl dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dl dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.chipno{font-family:var(--mono);font-size:15px;letter-spacing:.04em}
.chipno em{font-style:normal;color:var(--accent);font-weight:500}
.lineage{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;position:relative}
.lineage div{border-top:2px solid var(--line);padding-top:8px}
.lineage .F{border-color:#D48AAE} .lineage .M{border-color:#86A7DA}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.li .date{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:86px}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--ink-3)}
@media all{.li{grid-template-columns:1fr auto}.li .date{grid-column:1/-1;min-width:0}}

.ribbon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ribbon.p1{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tally span{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.tally b{font-family:var(--display);font-size:20px;font-weight:400;color:var(--ink)}

.docs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;text-align:left}
.doc .thumb{aspect-ratio:3/4;background:var(--surface-2);display:grid;place-items:center;max-width:100%}
.doc .thumb img{width:100%;height:100%;object-fit:cover}
.doc .cap{padding:8px 10px;font-size:13px;font-weight:600}
.doc .cap small{display:block;font-weight:400;color:var(--ink-3)}
.adddoc{border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;aspect-ratio:3/4.6;color:var(--ink-3);cursor:pointer;background:none;font-weight:600;gap:6px;align-content:center}

/* puppies */
.chartbox{overflow-x:auto;margin:6px -4px 0}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.chartbox.mini svg{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pups{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pup{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.pup:hover{border-color:var(--ink-3)}
.pup .n{font-weight:700}
.pup .s{font-size:13px;color:var(--ink-3)}
.pup .w{text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.pup .w b{font-size:17px}
.pup .w small{display:block;font-size:12px;color:var(--ink-3)}
.pup .w small.up{color:var(--ok)} .pup .w small.down{color:var(--bad)}
.pup .foot{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.kv{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:4px}
.kv div small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv div b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}

/* calendar */
.month{margin-bottom:20px}
.month h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 env(safe-area-inset-bottom,0px);animation:up .2s ease}
@media (min-width:100000px){.scrim{align-items:center;padding:24px}.sheet{border-radius:18px;max-height:88dvh}}

/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toTop=()=>{const s=document.getElementById("scroller");if(s)s.scrollTop=0};
const TIMEOUT=Symbol('timeout');
const withTimeout=(p,ms,fb)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r(fb),ms))]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const isoD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');

const isPregnant=dog=>S.litters.some(L=>L.damId===dog.id&&!L.whelped&&L.matings?.length&&diff(L.matings[0],today())<=75);

/* ---------- reminders engine ---------- */
let REM=new Map();
function reminders(){
  const R=[],T=today();
  for(const dog of S.dogs){if(dog.status!=='activ')continue;
    const latest={};
    for(const h of dog.health||[]){if(!['vaccin','depInt','depExt'].includes(h.kind))continue;const key=h.kind==='vaccin'?'vaccin:'+h.sub:h.kind;if(!latest[key]||h.date>latest[key].date)latest[key]=h}
    for(const [key,h] of Object.entries(latest)){if(!h.next)continue;
      R.push({key:'h:'+dog.id+':'+key,due:h.next,type:h.kind,title:h.kind==='vaccin'?'Rapel vaccin: '+h.sub:HEALTH[h.kind].label,who:dog.name,sub:'ultima: '+fmt(h.date)+(h.product?' · '+h.product:''),dogId:dog.id,act:'redo',hid:h.id})}
    if(dog.sex==='F'&&!isPregnant(dog)&&(dog.heats||[]).length){
      const last=[...dog.heats].sort((a,b)=>a.start<b.start?1:-1)[0];const due=addDays(last.start,Number(dog.heatInterval||S.kennel.heatInterval||180));const key='heat:'+dog.id+':'+last.id;
      if(!S.done[key])R.push({key,due,type:'heat',title:'Călduri estimate',who:dog.name,sub:'progesteron din ziua 5–7 a căldurilor',dogId:dog.id,act:'heat'})}
    for(const p of dog.planned||[]){const key='p:'+dog.id+':'+p.id;if(S.done[key])continue;R.push({key,due:p.due,type:'plan',title:p.title,who:dog.name,sub:p.sub||'programat de crescător',dogId:dog.id,act:'done'})}
  }
  for(const L of S.litters){const dam=dogById(L.damId);const who=(dam?dam.name:'—')+' × '+sireName(L);
    if(!L.whelped){if(!L.matings?.length||diff(L.matings[0],T)>75)continue;
      for(const m of PREG){const key='L:'+L.id+':'+m.k;if(S.done[key])continue;R.push({key,due:addDays(L.matings[0],m.day),type:'preg',title:m.t,who,sub:'gestație, ziua '+m.day,litterId:L.id,act:m.k==='due'?'whelp':'done'})}}
    else{const age=diff(L.whelped,T);if(age>75)continue;
      for(const t of PUPT){const key='L:'+L.id+':'+t.k;if(S.done[key])continue;R.push({key,due:addDays(L.whelped,t.day),type:'pup',title:t.t,who:'Cuib '+who,sub:'pui, ziua '+t.day,litterId:L.id,act:'done'})}
      if(L.puppies.length&&age<=56){const lw=lastWeigh(L);
        if(age<=14){if(lw!==T)R.push({key:'w:'+L.id+':'+T,due:T,type:'weigh',title:'Cântărire zilnică a puilor',who:'Cuib '+who,sub:'primele 14 zile: zilnic, la aceeași oră',litterId:L.id,act:'weigh'})}
        else{const due=addDays(lw||L.whelped,7);R.push({key:'w:'+L.id+':'+due,due,type:'weigh',title:'Cântărire săptămânală a puilor',who:'Cuib '+who,sub:'ultima: '+fmt(lw),litterId:L.id,act:'weigh'})}}}
  }
  R.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);REM=new Map(R.map(r=>[r.key,r]));return R;
}

/* weight chart */
function weightChart(L,mini){
  const pups=L.puppies.filter(p=>p.weights?.length);if(!pups.length)return '';
  const W=mini?400:360,Hh=mini?110:250,pl0=mini?4:40,pr=mini?4:10,pt=mini?6:10,pb=mini?6:26;
  let maxD=7,maxG=500;for(const p of pups)for(const w of p.weights){maxD=Math.max(maxD,diff(L.whelped,w.date));maxG=Math.max(maxG,w.g)}
  const step=maxG>4000?1000:maxG>1600?500:maxG>800?200:100;maxG=Math.ceil(maxG*1.05/step)*step;
  const x=d=>pl0+(W-pl0-pr)*d/maxD,y=g=>pt+(Hh-pt-pb)*(1-g/maxG);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Curba de creștere a puilor">`;
  if(!mini){for(let g=0;g<=maxG;g+=step){s+=`<line x1="${pl0}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${pl0-8}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${g>=1000?(g/1000).toString().replace('.',',')+' kg':g+' g'}</text>`}
    for(let d=0;d<=maxD;d+=7)s+=`<text x="${x(d)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${d===0?'naștere':'ziua '+d}</text>`}
  for(const p of pups){const pts=[...p.weights].sort((a,b)=>a.date<b.date?-1:1).map(w=>[x(diff(L.whelped,w.date)),y(w.g)]);const c=collarC(p.collar);const stroke=p.collar==='Alb'?'var(--ink-3)':p.collar==='Negru'?'var(--ink)':c;
    s+=`<polyline points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${stroke}" stroke-width="${mini?1.6:2}" stroke-linejoin="round" stroke-linecap="round"${p.collar==='Alb'?' stroke-dasharray="4 3"':' class="ln" pathLength="1"'}/>`;
    const e=pts[pts.length-1];if(!mini)s+=`<circle cx="${e[0]}" cy="${e[1]}" r="3.6" fill="${stroke}" stroke="var(--surface)" stroke-width="1.5"/>`}
  return s+'</svg>'}
function pupStats(p,L){const ws=[...(p.weights||[])].sort((a,b)=>a.date<b.date?-1:1);const last=ws[ws.length-1],prev=ws[ws.length-2];
  const bw=Number(p.birthWeight)||ws[0]?.g;let flag='',delta='';
  if(last&&prev){const dd=Math.max(1,diff(prev.date,last.date));const per=(last.g-prev.g)/dd;delta=(per>=0?'+':'')+Math.round(per)+' g/zi';
    const age=diff(L.whelped,last.date);
    if(last.g<prev.g&&(age>2||(bw&&last.g<bw*0.9)))flag='<span class="pill bad">Scădere în greutate</span>';}
  if(last&&bw){const age=diff(L.whelped,last.date);if(age>=10&&age<=16&&last.g<bw*2)flag+='<span class="pill warn">Nu și-a dublat greutatea</span>'}
  return {last,prev,delta,flag,mult:last&&bw?(last.g/bw).toFixed(1).replace('.',','):null}}

  <div class="dmeta"><span>${esc(d.breed||'')}${d.dob?' · '+ageStr(d.dob):''}</span>${pills.length?`<div class="pills">${pills.join('')}</div>`:''}</div></button>`}

function vDog(R){const d=dogById(ui.dogId);if(!d){ui.view='dogs';return vDogs()}
  const tabs=[['profil','Profil'],['sanatate','Sănătate'],['expo','Expoziții'],['repro','Reproducție'],['docs','Documente']];
  const pills=[];if(isPregnant(d))pills.push('<span class="pill acc">Gestantă</span>');(d.titles||'').split(',').filter(Boolean).forEach(t=>pills.push(`<span class="pill gold">${esc(t.trim())}</span>`));
  let h=`<button class="back" data-act="back" data-v="dogs">${I(IC.back)} Câinii mei</button>
  <div class="dhero" style="--h:${hue(d.name+d.breed)}">${d.photoId?`<img class="bgimg" data-photo="${esc(d.photoId)}" alt="" hidden>`:''}
  <button class="ph-btn" data-act="dogPhoto" aria-label="Schimbă fotografia"><span class="big">${d.photoId?`<img data-photo="${esc(d.photoId)}" alt="${esc(d.name)}" hidden><span class="ph">${esc((d.name||'?')[0])}</span>`:esc((d.name||'?')[0])}</span><span class="cam">${I(IC.cam)}</span></button>
  <div><p class="eyebrow" style="color:rgba(255,255,255,.75)">${esc(d.breed||'')}${d.dob?' · '+ageStr(d.dob):''}</p><h1>${esc(d.name)} ${sexSym(d.sex)}</h1><p class="rn">${esc(d.regName||'')}</p>${d.color?`<p class="sub">${esc(d.color)}</p>`:''}${pills.length?`<div class="pills">${pills.join('')}</div>`:''}</div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${ui.tab===k}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>`;
  const t=ui.tab;
  if(t==='profil')h+=dogProfil(d);else if(t==='sanatate')h+=dogHealth(d,R);else if(t==='expo')h+=dogShows(d);else if(t==='repro')h+=dogRepro(d);else h+=dogDocs(d);
  return h}
function dogProfil(d){const row=(k,v,cls='')=>`<div><dt>${k}</dt><dd class="${cls}">${v||'—'}</dd></div>`;
  const chip=String(d.chip||'').replace(/\D/g,'');
  return `<div class="cert"><div class="cert-top"><div><p class="eyebrow">Fișa de identitate</p><h2>${esc(d.regName||d.name)}</h2></div><button class="btn sm" data-act="editDog">${I(IC.edit)} Editează</button></div>
  <dl class="dl">${row('Microcip',`<span class="chipno">${fmtChip(d.chip)}</span>${chip.startsWith('642')&&chip.length===15?' <span class="pill" style="margin-left:4px">RO</span>':''}`)}${row('Nr. pedigree / registru',esc(d.pedigreeNo),'mono')}${row('Pașaport',esc(d.passport),'mono')}${row('Tatuaj',esc(d.tattoo),'mono')}
  ${row('Data nașterii',d.dob?fmt(d.dob)+' <span class="muted">('+ageStr(d.dob)+')</span>':'')}${row('Sex',d.sex==='F'?'Femelă':d.sex==='M'?'Mascul':'')}${row('Culoare',esc(d.color))}${row('Rasă',esc(d.breed))}
  ${row('Crescător',esc(d.breeder))}${row('Proprietar',esc(d.owner||S.kennel.owner))}${row('Titluri',esc(d.titles))}${row('Statut',esc(d.status))}</dl>
  <div class="lineage"><div class="M"><dt class="eyebrow">Tată</dt><dd style="margin:2px 0 0;font-weight:500">${esc(d.sire||'—')}</dd></div><div class="F"><dt class="eyebrow">Mamă</dt><dd style="margin:2px 0 0;font-weight:500">${esc(d.dam||'—')}</dd></div></div>
  ${d.notes?`<p style="margin-top:18px;position:relative;max-width:65ch;color:var(--ink-2)">${esc(d.notes)}</p>`:''}</div>${originCard(d)}`}
function originCard(d){const o=d.origin;if(!o)return '';const k=o.kennel||{};
  return `<section class="panel origin" style="margin-top:16px"><p class="eyebrow">Primit prin Afix · ${fmt(o.transferredAt)}</p><h2 style="margin-top:4px">De la ${esc(k.name||'crescător')}</h2>
  <dl class="dl" style="margin-top:12px">${k.owner?`<div><dt>Crescător</dt><dd>${esc(k.owner)}</dd></div>`:''}${k.city?`<div><dt>Localitate</dt><dd>${esc(k.city)}</dd></div>`:''}${k.phone?`<div><dt>Telefon</dt><dd class="mono" style="user-select:all">${esc(k.phone)}</dd></div>`:''}${k.email?`<div><dt>E-mail</dt><dd style="user-select:all">${esc(k.email)}</dd></div>`:''}${k.club?`<div><dt>Club</dt><dd>${esc(k.club)}</dd></div>`:''}
  ${o.food?`<div><dt>Hrana actuală</dt><dd>${esc(o.food)}</dd></div>`:''}${o.feeding?`<div><dt>Rația zilnică</dt><dd>${esc(o.feeding)}</dd></div>`:''}</dl>
  ${(o.parentTests||[]).length?`<p style="margin-top:14px;font-size:14px"><b>Testele părinților:</b> <span class="muted">${o.parentTests.map(esc).join(' · ')}</span></p>`:''}
  ${o.message?`<blockquote>${esc(o.message)}</blockquote>`:''}</section>`}
function dogHealth(d,R){const mine=R.filter(r=>r.dogId===d.id&&r.type!=='heat');
  const sec=kind=>{const items=(d.health||[]).filter(h=>h.kind===kind).sort((a,b)=>a.date<b.date?1:-1);
    return `<section class="panel"><div class="sec-h"><h2>${HEALTH[kind].plural}</h2><button class="btn sm" data-act="addHealth" data-k="${kind}">${I(IC.plus)} Adaugă</button></div>
    <div class="list">${items.length?items.map(h=>`<button class="li" data-act="editHealth" data-id="${h.id}"><span class="date">${fmt(h.date)}</span><span><span class="t">${esc(h.sub)}</span>${h.result?` · <b>${esc(h.result)}</b>`:''}<br><span class="s">${esc(h.product||'')}${h.notes?' · '+esc(h.notes):''}</span></span>${h.next?`<span class="pill ${stat(h.next)==='late'?'bad':stat(h.next)==='later'?'':'warn'}">următorul ${fmtS(h.next)}</span>`:'<span></span>'}</button>`).join(''):'<p class="empty">Nimic înregistrat încă.</p>'}</div></section>`};
  const ws=[...(d.weights||[])].sort((a,b)=>a.date<b.date?-1:1);
  return `${mine.length?`<section class="panel"><div class="sec-h"><h2>Urmează</h2></div><div class="rems">${mine.map(r=>remRow(r,false)).join('')}</div></section>`:''}
  ${sec('vaccin')}${sec('depInt')}${sec('depExt')}${sec('test')}${sec('vet')}
  <section class="panel"><div class="sec-h"><h2>Greutate</h2><button class="btn sm" data-act="addWeight">${I(IC.plus)} Cântărire</button></div>
  ${ws.length>1?`<div class="chartbox mini">${sparkKg(ws)}</div>`:''}
  <div class="list">${ws.length?[...ws].reverse().map((w,i)=>`<button class="li" data-act="editWeight" data-i="${ws.length-1-i}"><span class="date">${fmt(w.date)}</span><span class="t">${fmtKg(w.kg)}</span><span></span></button>`).join(''):'<p class="empty">Nicio cântărire.</p>'}</div></section>`}
function sparkKg(ws){const W=600,H=90,p=8;const ks=ws.map(w=>Number(w.kg));let mn=Math.min(...ks),mx=Math.max(...ks);if(mx-mn<1){mn-=.5;mx+=.5}
  const t0=pd(ws[0].date),t1=pd(ws[ws.length-1].date);const x=d=>p+(W-2*p)*((pd(d)-t0)/Math.max(1,t1-t0)),y=k=>p+(H-2*p-14)*(1-(k-mn)/(mx-mn));
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ');const e=ws[ws.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evoluția greutății"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(e.date)}" cy="${y(e.kg)}" r="4" fill="var(--accent)"/><text x="${p}" y="${H-2}" font-size="11" fill="var(--ink-3)">${fmtS(ws[0].date)}</text><text x="${W-p}" y="${H-2}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fmtKg(e.kg)} · ${fmtS(e.date)}</text></svg>`}
function tally(shows){const c={};for(const s of shows)for(const t of s.titles||[])c[t]=(c[t]||0)+1;const order=SHOW_TITLES.filter(t=>c[t]);
  return order.length?`<div class="tally">${order.map(t=>`<span><b>${c[t]}</b>${esc(t)}</span>`).join('')}</div>`:''}
function showRow(s,dog){return `<button class="li" data-act="editShow" data-id="${s.id}" data-dog="${dog.id}"><span class="ribbon ${s.place==='1'?'p1':''}">${esc(s.place||'—')}</span>
  <span><span class="t">${esc(s.name)}</span>${dog&&ui.view==='shows'?` · <b>${esc(dog.name)}</b>`:''}<br><span class="s">${fmt(s.date)} · ${esc(s.cls||'')} · ${esc(s.grade||'')}${s.judge?' · arbitru '+esc(s.judge):''}</span></span>
  <span class="pills" style="justify-content:flex-end">${(s.titles||[]).map(t=>`<span class="pill gold">${esc(t)}</span>`).join('')}</span></button>`}
function dogShows(d){const shows=[...(d.shows||[])].sort((a,b)=>a.date<b.date?1:-1);
  return `<section class="panel"><div class="sec-h"><h2>Rezultate în ring</h2><button class="btn sm" data-act="addShow">${I(IC.plus)} Rezultat nou</button></div>${tally(shows)}
  <div class="list">${shows.length?shows.map(s=>showRow(s,d)).join(''):'<p class="empty">Niciun rezultat. Adaugă primul concurs.</p>'}</div></section>`}
function dogRepro(d){
  if(d.sex==='M'){const ls=S.litters.filter(L=>L.sireId===d.id);
    return `<section class="panel"><div class="sec-h"><h2>Monte și cuiburi</h2><button class="btn sm" data-act="addLitter">${I(IC.plus)} Montă nouă</button></div><div class="list">${ls.length?ls.map(litRow).join(''):'<p class="empty">Nicio montă înregistrată.</p>'}</div></section>`}
  const hs=[...(d.heats||[])].sort((a,b)=>a.start<b.start?1:-1);const ls=S.litters.filter(L=>L.damId===d.id);
  const next=hs[0]?addDays(hs[0].start,Number(d.heatInterval||S.kennel.heatInterval||180)):null;
  return `<section class="panel"><div class="sec-h"><h2>Călduri</h2><button class="btn sm" data-act="addHeat">${I(IC.plus)} Călduri noi</button></div>
  ${next&&!isPregnant(d)?`<p style="margin-bottom:8px">Următoarele călduri estimate: <b>${fmt(next)}</b> <span class="muted">(${rel(next)}, interval ${d.heatInterval||S.kennel.heatInterval||180} zile)</span></p>`:''}
  <div class="list">${hs.length?hs.map(x=>`<button class="li" data-act="editHeat" data-id="${x.id}"><span class="date">${fmt(x.start)}</span><span><span class="t">${x.end?pl(diff(x.start,x.end)+1,'zi','zile'):'în curs'}</span>${x.prog?`<br><span class="s">Progesteron: ${esc(x.prog)}</span>`:''}${x.notes?`<br><span class="s">${esc(x.notes)}</span>`:''}</span><span></span></button>`).join(''):'<p class="empty">Nicio perioadă de călduri notată.</p>'}</div></section>
  <section class="panel"><div class="sec-h"><h2>Gestații și cuiburi</h2><button class="btn sm" data-act="addLitter">${I(IC.plus)} Montă nouă</button></div><div class="list">${ls.length?ls.map(litRow).join(''):'<p class="empty">Niciun cuib încă.</p>'}</div></section>`}
function litRow(L){const dam=dogById(L.damId);return `<button class="li" data-act="litter" data-id="${L.id}"><span class="date">${fmt(L.whelped||L.matings?.[0])}</span><span><span class="t">${esc(dam?.name||'—')} × ${esc(sireName(L))}</span><br><span class="s">${L.whelped?pl(L.puppies.length,'pui','pui')+' · născuți '+fmt(L.whelped):'gestație · fătare estimată '+fmt(addDays(L.matings[0],63))}</span></span><span class="pill ${L.whelped?'':'acc'}">${L.whelped?'născut':'gestație'}</span></button>`}
function dogDocs(d){const docs=d.docs||[];
  return `<section class="panel"><div class="sec-h"><h2>Documente și fotografii</h2></div><p class="muted" style="margin:-4px 0 14px;max-width:62ch">Pedigree (față și verso), pașaport, certificate de campion, rezultate HD/ED, contracte. Le ai la tine la orice expoziție sau control.</p>
  <div class="docs">${docs.map(x=>`<button class="doc" data-act="viewDoc" data-id="${x.id}"><div class="thumb"><img data-photo="${esc(x.photoId)}" alt="${esc(x.label)}" hidden><span class="ph muted">${I(IC.doc)}</span></div><div class="cap">${esc(x.label)}<small>${fmt(x.date)}</small></div></button>`).join('')}
  <button class="adddoc" data-act="addDoc">${I(IC.cam)}<span>Adaugă document</span></button></div></section>`}

/* litters */
function vLitters(){const ls=[...S.litters].sort((a,b)=>(b.whelped||b.matings?.[0]||'')<(a.whelped||a.matings?.[0]||'')?-1:1);
  return `<div class="vh"><div><h1>Cuiburi</h1><p class="sub">Monte, gestații, fătări și creșterea fiecărui pui</p></div><button class="btn primary" data-act="addLitter">${I(IC.plus)} Montă nouă</button></div>
  ${ls.length?`<div class="dogs">${ls.map(L=>L.whelped?nestCard(L):pregCard(L)).join('')}</div>`:'<div class="panel empty big"><h3>Niciun cuib încă</h3><p>Înregistrează o montă: Afix calculează ziua fătării și îți amintește de ecografie, radiografie și temperatura femelei.</p></div>'}`}
function vLitter(){const L=litterById(ui.litterId);if(!L){ui.view='litters';return vLitters()}
  const T=today(),dam=dogById(L.damId);
  let h=`<button class="back" data-act="back" data-v="litters">${I(IC.back)} Cuiburi</button>
  <div class="vh"><div><p class="eyebrow">${L.whelped?'Cuib născut '+fmt(L.whelped)+' · '+ageStr(L.whelped):'Gestație · ziua '+diff(L.matings[0],T)}</p><h1>${esc(dam?.name||'—')} × ${esc(sireName(L))}</h1>
  <p class="sub">Monte: ${(L.matings||[]).map(fmt).join(', ')}${L.notes?' · '+esc(L.notes):''}</p></div>
  <div class="row-actions"><button class="btn" data-act="editLitter">${I(IC.edit)} Editează</button>${L.whelped?`<button class="btn" data-act="addPuppy">${I(IC.plus)} Pui</button><button class="btn primary" data-act="weigh" data-id="${L.id}">${I(IC.scale)} Cântărire</button>`:`<button class="btn primary" data-act="whelp" data-id="${L.id}">Înregistrează fătarea</button>`}</div></div>`;
  const tasks=(L.whelped?PUPT:PREG).map(m=>{const key='L:'+L.id+':'+m.k,due=addDays(L.whelped||L.matings[0],m.day),dn=S.done[key];
    return `<li class="${dn?'done':''}"><button class="check ${dn?'on':''}" data-act="task" data-key="${key}" aria-label="Bifează">${I(IC.check)}</button><span class="t">${esc(m.t)}</span><span class="d">${dn?'făcut '+fmtS(dn):fmtS(due)+(!dn&&diff(T,due)<0?' <b style="color:var(--bad)">!</b>':'')}</span></li>`}).join('');
  if(!L.whelped){const day=diff(L.matings[0],T);
    h+=`<div class="grid2"><section class="panel"><div class="cardrow"><div><p class="eyebrow">Fătare estimată</p><h2 style="font-size:28px">${fmt(addDays(L.matings[0],63))}</h2><p class="muted">interval normal ${fmt(addDays(L.matings[0],58))} – ${fmt(addDays(L.matings[0],68))}</p></div><div class="count"><b>${Math.max(0,63-day)}</b><small>zile rămase</small></div></div>
    <div class="track"><div class="fill" style="width:${Math.min(100,day/63*100)}%"></div>${PREG.map(m=>`<i class="${day>=m.day?'past':''}" style="left:${m.day/63*100}%"></i>`).join('')}</div>
    <p class="muted" style="font-size:13px;margin-top:10px;max-width:60ch">Durata gestației se calculează de la prima montă. Dacă ai data ovulației din testul de progesteron, fătarea are loc de obicei la 63 de zile (±1) de la ovulație.</p></section>
    <section class="panel"><h2>Pașii gestației</h2><ul class="milestones">${tasks}</ul></section></div>`;return h}
  const pups=L.puppies;const lastW=pups.map(p=>pupStats(p,L).last?.g).filter(Boolean);const avg=lastW.length?lastW.reduce((a,b)=>a+b,0)/lastW.length:null;
  h+=`<section class="panel"><div class="kv"><div><small>Pui</small><b>${pups.length}</b></div><div><small>Masculi / femele</small><b>${pups.filter(p=>p.sex==='M').length} / ${pups.filter(p=>p.sex==='F').length}</b></div><div><small>Greutate medie azi</small><b>${fmtG(avg)}</b></div><div><small>Rezervați / vânduți</small><b>${pups.filter(p=>p.status==='Rezervat').length} / ${pups.filter(p=>p.status==='Vândut').length}</b></div></div>
  ${pups.some(p=>p.weights?.length>1)?`<div class="sec-h" style="margin-top:18px"><h2>Curba de creștere</h2><span class="muted" style="font-size:13px">ultima cântărire ${fmt(lastWeigh(L))}</span></div><div class="chartbox">${weightChart(L)}</div>
  <div class="legend">${pups.map(p=>`<span><span class="collar" style="--c:${collarC(p.collar)}"></span>${esc(p.collar)}${p.name?' · '+esc(p.name):''}</span>`).join('')}</div>`:''}</section>
  <div class="sec-h" style="margin-top:22px"><h2>Puii</h2><button class="btn sm" data-act="addPuppy">${I(IC.plus)} Adaugă pui</button></div>
  ${pups.length?`<div class="pups">${pups.map(p=>{const st=pupStats(p,L);return `<button class="pup" data-act="editPuppy" data-id="${p.id}">${p.photoId?`<span class="pupav" style="--c:${collarC(p.collar)}"><img data-photo="${esc(p.photoId)}" alt="" hidden></span>`:`<span class="collar lg" style="--c:${collarC(p.collar)}"></span>`}
    <div style="min-width:0"><div class="n">${esc(p.collar)}${p.name?' · '+esc(p.name):''} ${sexSym(p.sex)}</div><div class="s">${esc(p.color||'')} · la naștere ${fmtG(Number(p.birthWeight)||null)}</div></div>
    <div class="w"><b>${fmtG(st.last?.g)}</b><small class="${st.delta.startsWith('-')?'down':'up'}">${st.delta||''}${st.mult?' · ×'+st.mult:''}</small></div>
    <div class="foot"><span class="pill ${pupPill(p.status)}">${esc(p.status)}</span>${p.buyer?`<span class="pill">${esc(p.buyer)}</span>`:''}${(t=>t?`<span class="pill ${t.claimedAt?'ok':'acc'}">${t.claimedAt?'Fișă transferată':'Cod de transfer trimis'}</span>`:'')(S.transfers.find(t=>t.pupId===p.id))}${st.flag}</div></button>`}).join('')}</div>`:'<div class="panel empty">Adaugă puii cu zgărdița colorată, sexul și greutatea la naștere.</div>'}
  <section class="panel" style="margin-top:16px"><h2>Programul puilor</h2><ul class="milestones">${tasks}</ul></section>`;
  return h}

/* calendar */
function vCal(R){const T=today();const late=R.filter(r=>r.due<T);const fut=R.filter(r=>r.due>=T&&diff(T,r.due)<=365);
  const groups={};for(const r of fut){const k=r.due.slice(0,7);(groups[k]=groups[k]||[]).push(r)}
  return `<div class="vh"><div><h1>Calendar</h1><p class="sub">Vaccinuri, deparazitări, călduri, gestații și pui, calculate automat din istoric</p></div></div>
  ${late.length?`<section class="panel month"><h3 style="color:var(--bad)">Întârziate</h3><div class="rems">${late.map(r=>remRow(r)).join('')}</div></section>`:''}
  ${Object.keys(groups).length?Object.entries(groups).map(([k,rs])=>`<section class="panel month"><h3>${FM.format(pd(k+'-01'))}</h3><div class="rems">${rs.map(r=>remRow(r)).join('')}</div></section>`).join(''):'<div class="panel empty">Nimic programat. Adaugă vaccinuri și deparazitări pe fișa fiecărui câine.</div>'}`}

/* shows */

  const yr=String(new Date().getFullYear());const thisYr=all.filter(([s])=>s.date.startsWith(yr)).map(x=>x[0]);
  return `<div class="vh"><div><h1>Expoziții</h1><p class="sub">Toate rezultatele canisei, cu titlurile câștigate</p></div><button class="btn primary" data-act="addShowAny">${I(IC.plus)} Rezultat nou</button></div>
  <section class="panel"><div class="sec-h"><h2>Titluri în ${yr}</h2></div>${tally(thisYr)||'<p class="muted">Niciun titlu anul acesta.</p>'}</section>
  <section class="panel"><div class="sec-h"><h2>Istoric</h2></div><div class="list">${all.length?all.map(([s,d])=>showRow(s,d)).join(''):'<p class="empty">Niciun rezultat.</p>'}</div></section>`}

/* settings */
function vSettings(){const k=S.kennel;
  const own=isOwnerRole();const trs=[...(S.transfers||[])].reverse();
  return `<div class="vh"><div><h1>Setări</h1><p class="sub">Contul, ${own?'':'canisa, transferurile '}și datele tale</p></div></div>

function fieldHTML(f,v){const id='f_'+f.k,cls=`field${f.half?' half':''}${f.mono?' mono':''}`;const lab=`<span>${esc(f.label)}${f.required?' *':''}</span>`;

  onModalOpen();hydrate();
  const form=$('#sheet');
  for(const f of o.fields)if(f.type==='photo'){const inp=$('#f_'+f.k);inp.addEventListener('change',async()=>{const file=inp.files[0];if(!file)return;const drop=$('#d_'+f.k);drop.innerHTML='<span class="hint">Se procesează…</span>';

  if(o.onInput){const get=k=>{const el=$('#f_'+k);return el?el.value:''};const set=(k,v)=>{const el=$('#f_'+k);if(el)el.value=v};form.addEventListener('input',e=>o.onInput(e.target.id.replace(/^f_/,''),get,set));form.addEventListener('change',e=>o.onInput(e.target.id.replace(/^f_/,''),get,set))}

      const el=$('#f_'+f.k);let v=el?el.value.trim():'';out[f.k]=v;const er=$('#e_'+f.k);if(er)er.hidden=true;
      if(f.required&&!v){showErr(f.k,'Câmp obligatoriu.');ok=false;continue}
      if(f.validate&&v){const m=f.validate(v);if(m){showErr(f.k,m);ok=false}}}
    if(!ok)return;const me=FORM;const sb=form.querySelector('[type=submit]');sb.disabled=true;
    try{await o.onSave(out);if(FORM===me)closeModal()}catch(err){console.warn(err);if(err&&err.field)showErr(err.field,err.msg);else toast(err&&err.msg||'Nu s-a putut salva.')}finally{sb.disabled=false}});
  $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  $('#modal').querySelector('[data-scrim]').addEventListener('mousedown',e=>{if(e.target.hasAttribute('data-scrim'))closeModal()});
  const del=$('#modal').querySelector('[data-del]');if(del)del.onclick=()=>confirmBox(o.deleteMsg||'Ștergi această înregistrare?',async()=>{await o.onDelete();closeModal()});

  setTimeout(()=>{const first=form.querySelector('.fields input:not([type=file]):not([type=checkbox]),.fields select');if(first&&matchMedia('(min-width:700px)').matches)first.focus()},30);
}

const snap=()=>({view:ui.view,dogId:ui.dogId,tab:ui.tab,litterId:ui.litterId});
const sameView=(a,b)=>a&&b&&a.view===b.view&&a.dogId===b.dogId&&a.litterId===b.litterId;

function confirmBox(msg,yes){const prev=$('#modal').innerHTML;const wrap=document.createElement('div');wrap.className='scrim';wrap.style.zIndex=55;
  wrap.innerHTML=`<div class="sheet" style="max-width:440px"><header><h2>Ești sigur?</h2></header><p class="intro" style="padding-bottom:16px">${esc(msg)}</p><footer><span class="sp"></span><button class="btn ghost" data-n>Renunță</button><button class="btn primary" data-y style="background:var(--bad);border-color:var(--bad);color:#fff">Da, șterge</button></footer></div>`;

async function compress(file,max){const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});URL.revokeObjectURL(url);
  let scale=Math.min(1,max/Math.max(img.width,img.height)),q=.82,out='';
  for(let t=0;t<10;t++){const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);if(out.length<235000)return out;if(q>.6)q-=.08;else scale*=.82}
  return out}

const PRICE=19;
const APP_URL='https://claude.ai/artifact/MbBFEnWLtz7v4MisvnkP2a';
const CODE_AB='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){const r=crypto.getRandomValues(new Uint8Array(8));let s='';for(const b of r)s+=CODE_AB[b%CODE_AB.length];return 'AFX-'+s.slice(0,4)+'-'+s.slice(4)}
const normCode=v=>{let s=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!s.startsWith('AFX'))s='AFX'+s;return s};
const fmtCode=s=>s.slice(0,3)+'-'+s.slice(3,7)+'-'+s.slice(7,11);
const te=new TextEncoder(),td=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function codeKeys(code){const base=await crypto.subtle.importKey('raw',te.encode(normCode(code)),'PBKDF2',false,['deriveKey','deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('afix-transfer-id-v1'),iterations:150000,hash:'SHA-256'},base,128);
  const id=[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('afix-transfer-key-v1'),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return {id,key}}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))))}}
const TR={
  async put(id,doc){if(Store.db)await Store.db.doc('transfers/'+id).set(doc);else localStorage.setItem('afix-tr-'+id,JSON.stringify(doc))},
  async get(id){if(Store.db){const s=await Store.db.doc('transfers/'+id).get();return s.exists?s.data():null}try{const r=localStorage.getItem('afix-tr-'+id);return r?JSON.parse(r):null}catch(e){return null}},
  async mark(id,patch){if(Store.db)await Store.db.doc('transfers/'+id).update(patch);else{const d=await this.get(id);if(d)localStorage.setItem('afix-tr-'+id,JSON.stringify(Object.assign(d,patch)))}}
};
async function buildPackage(L,p,o){const dam=dogById(L.damId),sire=dogById(L.sireId);const dn=k=>S.done['L:'+L.id+':'+k];

  if(dn('vac1'))health.push({id:uid(),kind:'vaccin',sub:'Polivalent (DHPPi+L)',date:dn('vac1'),next:'',product:'',notes:'Primul vaccin de pui, la crescător'});
  if(dn('chip'))health.push({id:uid(),kind:'vet',sub:'Control de rutină',date:dn('chip'),next:'',product:'',result:'Microcipare și carnet de sănătate',notes:''});
  const tests=[];const tt=(dog,who)=>{for(const h of dog?.health||[])if(h.kind==='test'&&h.result)tests.push(who+': '+h.sub.replace(/ \(.*\)/,'')+' '+h.result)};tt(sire,'Tată');tt(dam,'Mamă');
  const planned=[];if(o.nextVac)planned.push({id:uid(),due:o.nextVac,title:'Rapel vaccin de pui',sub:'programat de crescător'});
  if(o.nextDep)planned.push({id:uid(),due:o.nextDep,title:'Deparazitare internă',sub:'programată de crescător; la pui, la 2 săptămâni până la 3 luni'});

  return {v:1,createdAt:today(),payer:o.payer,newOwner:o.newOwner||'',
    pup:{name:p.name||'',collar:p.collar,sex:p.sex,color:p.color,dob:L.whelped,chip:p.chip||'',birthWeight:p.birthWeight,weights:(p.weights||[]).map(w=>({date:w.date,kg:Math.round(w.g/10)/100})),photo},
    breed:dam?.breed||sire?.breed||'',sire:sire?(sire.regName||sire.name):(L.sireExt||''),dam:dam?(dam.regName||dam.name):'',parentTests:tests,health,planned,

async function createTransfer(L,p,out,paid){const code=genCode();const pkg=await buildPackage(L,p,out);const {id,key}=await codeKeys(code);

  try{await TR.put(id,Object.assign({v:1,payer:out.payer,paid:!!paid,createdAt:new Date().toISOString(),claimedAt:null},box))}catch(e){console.warn(e);throw {msg:'Codul nu a putut fi salvat. Încearcă din nou.'}}
  const dam=dogById(L.damId);const t={code,id,pupId:p.id,litterId:L.id,label:'Pui '+p.collar.toLowerCase()+(p.name?' ('+p.name+')':'')+' · '+(dam?.name||'')+' × '+sireName(L),newOwner:out.newOwner||'',createdAt:today(),payer:out.payer,claimedAt:null};
  S.transfers.push(t);if(p.status==='Disponibil')p.status='Rezervat';save();codeSheet(t)}

  const msg=`Bună${t.newOwner?', '+t.newOwner:''}! Fișa digitală a cățelului tău (${pupL.toLowerCase()}) de la ${S.kennel.name||'canisa noastră'} te așteaptă în Afix.\n\n1. Deschide: ${link}\n2. Alege „Am primit un cățel”\n3. Introdu codul: ${t.code}\n\nAi acolo microcipul, părinții, cântăririle, vaccinurile și mementourile pentru următoarele tratamente.`;

  <div class="sbody"><div class="pills"><span class="pill ${t.claimedAt?'ok':'warn'}">${t.claimedAt?'Activat pe '+fmt(t.claimedAt.slice(0,10)):'Așteaptă activarea'}</span><span class="pill">${esc(pupL)}</span><span class="pill ${t.payer==='breeder'?'ok':''}">${t.payer==='breeder'?'Plătit de tine':'Plătește proprietarul: '+PRICE+' lei'}</span></div>
  <div class="codebox" id="codeTxt">${esc(t.code)}</div>
  <div class="qr" id="qr"></div><p class="fine" style="text-align:center;margin:-4px auto 0">Noul proprietar scanează codul QR la predarea cățelului sau primește mesajul de mai jos.</p>
  <div class="msgbox" id="msgTxt">${esc(msg)}</div></div>
  <footer><button class="btn" id="cpCode">Copiază codul</button><button class="btn" id="cpMsg">Copiază mesajul</button><span class="sp"></span><button class="btn primary" data-close>Gata</button></footer></div></div>`;
  bindSheet();
  try{if(window.QRCode)new QRCode($('#qr'),{text:link,width:168,height:168,colorDark:'#17201D',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else $('#qr').hidden=true}catch(e){$('#qr').hidden=true}
  $('#cpCode').onclick=()=>copyText(t.code,$('#codeTxt'));$('#cpMsg').onclick=()=>copyText(msg,$('#msgTxt'))}
function claimForm(pre){openForm({title:'Am primit un cățel',intro:'Introdu codul primit de la crescător, din mesaj sau de pe fișa de la predare. Îl poți scrie cu sau fără cratime.',
  fields:[{k:'code',label:'Cod de transfer',required:true,mono:true,placeholder:'AFX-XXXX-XXXX',validate:v=>normCode(v).length===11?null:'Codul are forma AFX-XXXX-XXXX.'}],values:{code:pre||''},saveLabel:'Caută fișa',
  onSave:async out=>{const code=fmtCode(normCode(out.code));const {id,key}=await codeKeys(code);let doc;
    try{doc=await TR.get(id)}catch(e){throw {msg:'Nu am putut verifica codul acum. Încearcă din nou.'}}
    if(!doc)throw {field:'code',msg:'Nu am găsit acest cod. Verifică literele și cifrele.'};
    if(doc.claimedAt)throw {field:'code',msg:'Codul a fost deja activat pe '+fmt(doc.claimedAt.slice(0,10))+'.'};
    let pkg;try{pkg=JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},key,unb64(doc.ct))))}catch(e){throw {field:'code',msg:'Codul nu se potrivește cu nicio fișă.'}}
    pendingCode='';previewSheet({code,id,doc,pkg})}})}
function previewSheet(x){FORM={preview:true};const {pkg,doc}=x,p=pkg.pup,k=pkg.kennel||{};const mustPay=doc.payer!=='breeder'&&!doc.paid;
  const nm=p.name||('Puiul cu zgărdiță '+String(p.collar||'').toLowerCase());
  $('#modal').innerHTML=`<div class="scrim" data-scrim><div class="sheet" style="max-width:520px"><header><h2>Fișa e gata</h2><button class="icon-btn" data-close aria-label="Închide">${I(IC.x)}</button></header>
  <div class="sbody"><div class="pv"><span class="av" style="--h:${hue(nm)}">${p.photo?`<img src="${p.photo}" alt="">`:esc(nm[0])}</span><div><p class="eyebrow">De la ${esc(k.name||'crescător')}</p><h3>${esc(nm)} ${sexSym(p.sex)}</h3><p class="muted">${esc(pkg.breed||'')} · născut ${fmt(p.dob)} (${ageStr(p.dob)})</p></div></div>
  <ul class="incl"><li>${I(IC.check)}<span>Tată: <b>${esc(pkg.sire||'—')}</b> · Mamă: <b>${esc(pkg.dam||'—')}</b></span></li>
  ${pkg.parentTests?.length?`<li>${I(IC.check)}<span>${pl(pkg.parentTests.length,'test de sănătate','teste de sănătate')} ale părinților</span></li>`:''}
  <li>${I(IC.check)}<span>${pl(p.weights?.length||0,'cântărire','cântăriri')} de la naștere${p.chip?' · microcip '+esc(p.chip):''}</span></li>
  <li>${I(IC.check)}<span>${pl(pkg.health?.length||0,'tratament înregistrat','tratamente înregistrate')} și ${pl(pkg.planned?.length||0,'memento','mementouri')} programate</span></li>
  ${pkg.message?`<li>${I(IC.check)}<span>Un mesaj de la crescător</span></li>`:''}</ul>
  ${mustPay?`<div class="price"><div><span>Activarea fișei digitale</span><br><span>plată unică, fără abonament</span></div><b>${PRICE} lei</b></div>`:`<p class="pill ok" style="align-self:flex-start">Activarea a fost plătită de crescător</p>`}</div>
  <footer><span class="sp"></span><button class="btn ghost" data-close>Mai târziu</button><button class="btn primary" id="actBtn">${mustPay?'Plătește și activează':'Activează fișa'}</button></footer></div></div>`;
  bindSheet();
  $('#actBtn').onclick=async()=>{if(mustPay)paySheet({title:'Activează fișa',item:'Fișa digitală · '+nm,onPay:()=>completeClaim(x)});else{$('#actBtn').disabled=true;try{await completeClaim(x)}catch(e){toast('Activarea nu a reușit. Încearcă din nou.');$('#actBtn').disabled=false}}}}
async function completeClaim({code,id,pkg}){const p=pkg.pup;
  const fresh=await TR.get(id);if(fresh&&fresh.claimedAt)throw {msg:'Codul a fost deja activat.'};
  let photoId='';if(p.photo){photoId=uid();await Store.putPhoto(photoId,p.photo)}
  if(!S.account){if(S.sample){const keep=S.transfers;S=emptyState()}S.account={role:'owner',since:today()}}
  const d={id:uid(),name:p.name||'Cățelul meu',regName:'',breed:pkg.breed||'',sex:p.sex,dob:p.dob,color:p.color||'',chip:p.chip||'',tattoo:'',passport:'',pedigreeNo:'',sire:pkg.sire||'',dam:pkg.dam||'',breeder:pkg.kennel?.name||'',owner:'',titles:'',status:'activ',notes:'',photoId,
    health:pkg.health||[],weights:p.weights||[],shows:[],heats:[],docs:[],planned:pkg.planned||[],
    origin:{kennel:pkg.kennel||{},message:pkg.message||'',food:pkg.food||'',feeding:pkg.feeding||'',parentTests:pkg.parentTests||[],transferredAt:today(),code}};
  S.dogs.push(d);try{await TR.mark(id,{claimedAt:new Date().toISOString(),paid:true})}catch(e){console.warn(e)}
  ui.locked=false;ui.view='dog';ui.dogId=d.id;ui.tab='profil';save();closeModal();toast(`Bine ai venit acasă, ${d.name}!`);
  if(!p.name)setTimeout(()=>dogForm(d),700)}
let lastRefresh=0;
async function refreshTransfers(){if(!Store.ready||!(S.transfers||[]).some(t=>!t.claimedAt)||Date.now()-lastRefresh<20000)return;lastRefresh=Date.now();let ch=false;
  for(const t of S.transfers){if(t.claimedAt)continue;try{const d=await TR.get(t.id);if(d&&d.claimedAt){t.claimedAt=d.claimedAt;const L=litterById(t.litterId);const p=L?.puppies.find(x=>x.id===t.pupId);if(p)p.status='Vândut';ch=true}}catch(e){}}
  if(ch){save();toast('Un proprietar nou a activat fișa cățelului')}}

/* ---------- export / import ---------- */
async function doExport(){const photos={};const ids=[];for(const d of S.dogs){if(d.photoId)ids.push(d.photoId);for(const x of d.docs||[])ids.push(x.photoId)}
  for(const id of ids){const v=await Store.getPhoto(id);if(v)photos[id]=v}
  const json=JSON.stringify({app:'afix',exported:new Date().toISOString(),state:S,photos});const name='afix-'+(S.kennel.name||'canisa').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+today()+'.json';
  let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Copia de siguranță a fost salvată');return}catch(e){if(e&&e.code==='declined')return}}
  openForm({title:'Copie de siguranță',intro:'Descărcarea directă nu e disponibilă aici. Copiază textul de mai jos într-un fișier .json.',fields:[{k:'json',label:'Date',type:'textarea'}],values:{json},saveLabel:'Copiază',onSave:async()=>{try{await navigator.clipboard.writeText(json);toast('Copiat')}catch(e){$('#f_json')?.select();throw e}}})}
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const obj=JSON.parse(await f.text());if(!obj.state||!Array.isArray(obj.state.dogs))throw 0;
    confirmBox(`Importul înlocuiește datele actuale cu ${obj.state.dogs.length} câini din fișier.`,async()=>{for(const [id,v] of Object.entries(obj.photos||{}))await Store.putPhoto(id,v);const acc=S.account;S=obj.state;S.done=S.done||{};S.transfers=S.transfers||[];S.account=S.account||acc;save();toast('Date restaurate')})}
  catch(err){toast('Fișierul nu este o copie Afix validă.')}});

/* ---------- actions ---------- */
const A={
  nav:el=>{go({view:el.dataset.v});if(ui.view==='settings')refreshTransfers()},
  dog:el=>go({view:'dog',dogId:el.dataset.id,tab:'profil'}),
  litter:el=>{go({view:'litter',litterId:el.dataset.id});refreshTransfers()},
  back:el=>{const prev=navStack.pop();go(prev&&!sameView(prev,snap())?prev:{view:el.dataset.v},true)},
  claim:()=>claimForm(),showCode:el=>codeSheet(S.transfers.find(t=>t.code===el.dataset.code)),
  enter:()=>{ui.locked=false;render()},
  logout:()=>{ui.locked=true;closeModal();toTop();render()},
  role:el=>{const r=el.dataset.r;
    if(el.dataset.switch){S.account.role=r;if(r==='owner'&&ui.view==='litters')ui.view='home';save();toast(r==='owner'?'Profil de proprietar':'Profil de crescător');return}
    if(!S.account){if(r==='owner'&&S.sample)S=emptyState();S.account={role:r,since:today()}}else if(r==='breeder')S.account.role='breeder';
    ui.locked=false;ui.view=r==='owner'?'dogs':'home';toTop();save();
    if(r==='owner')claimForm(pendingCode);else if(!S.sample&&!S.kennel.name)kennelForm()},
  tab:el=>{ui.tab=el.dataset.t;render()},filter:el=>{ui.filter=el.dataset.f;render()},
  addDog:()=>dogForm(),editDog:()=>dogForm(dogById(ui.dogId)),
  dogPhoto:()=>{const d=dogById(ui.dogId);openForm({title:'Fotografia lui '+d.name,fields:[{k:'photoId',label:'Fotografie',type:'photo',max:900,required:true}],values:{photoId:d.photoId},onSave:async out=>{d.photoId=await storePhoto(out,'photoId');save()}})},
  addHealth:el=>healthForm(dogById(ui.dogId),el.dataset.k),
  editHealth:el=>{const d=dogById(ui.dogId);const h=d.health.find(x=>x.id===el.dataset.id);healthForm(d,h.kind,h)},
  addWeight:()=>weightForm(dogById(ui.dogId)),editWeight:el=>weightForm(dogById(ui.dogId),+el.dataset.i),
  addShow:()=>showForm(dogById(ui.dogId)),addShowAny:()=>{if(!S.dogs.length)return toast('Adaugă întâi un câine.');showForm(null,null,true)},
  editShow:el=>{const d=dogById(el.dataset.dog);showForm(d,d.shows.find(s=>s.id===el.dataset.id))},
  addHeat:()=>heatForm(dogById(ui.dogId)),editHeat:el=>{const d=dogById(ui.dogId);heatForm(d,d.heats.find(x=>x.id===el.dataset.id))},
  addDoc:()=>docForm(dogById(ui.dogId)),viewDoc:el=>{const d=dogById(ui.dogId);viewDoc(d,d.docs.find(x=>x.id===el.dataset.id))},
  addLitter:()=>litterForm(null,ui.view==='dog'&&dogById(ui.dogId)?.sex==='F'?ui.dogId:null),editLitter:()=>litterForm(litterById(ui.litterId)),
  whelp:el=>whelpForm(litterById(el.dataset.id||ui.litterId)),weigh:el=>weighForm(litterById(el.dataset.id||ui.litterId)),
  addPuppy:()=>puppyForm(litterById(ui.litterId)),editPuppy:el=>{const L=litterById(ui.litterId);puppyForm(L,L.puppies.find(p=>p.id===el.dataset.id))},
  task:el=>{const k=el.dataset.key;if(S.done[k])delete S.done[k];else S.done[k]=today();save()},
  rem:el=>{const r=REM.get(el.dataset.key);if(!r)return;
    if(r.act==='done'){S.done[r.key]=today();save();toast('Bifat: '+r.title)}
    else if(r.act==='redo'){const d=dogById(r.dogId);const h=d.health.find(x=>x.id===r.hid);ui.dogId=d.id;healthForm(d,h.kind,null,{sub:h.sub,product:h.product,date:today()})}
    else if(r.act==='weigh')weighForm(litterById(r.litterId));
    else if(r.act==='whelp')whelpForm(litterById(r.litterId));
    else if(r.act==='heat'){ui.dogId=r.dogId;heatForm(dogById(r.dogId))}},
  editKennel:()=>kennelForm(),export:()=>doExport(),import:()=>$('#importFile').click(),
  clearSample:()=>confirmBox(S.sample?'Datele demonstrative vor fi înlocuite cu o canisă goală.':'Toți câinii, cuiburile și rezultatele vor fi șterse definitiv.',async()=>{
    for(const d of S.dogs){if(d.photoId)Store.delPhoto(d.photoId);for(const x of d.docs||[])Store.delPhoto(x.photoId)}
    const k=S.sample?null:S.kennel,acc=S.account;S=emptyState();if(k)S.kennel=k;S.account=acc;ui.view='home';save();if(!isOwnerRole())kennelForm()}),
  loadSample:()=>{const acc=S.account;S=makeSample();S.account=acc;ui.view='home';save();toast('Canisa exemplu a fost încărcată')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.closest('#sheet'))return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}

/* ---------- boot ---------- */
render();
let booted=false;
function boot(data){if(booted)return;booted=true;Store.ready=true;
  try{if(data&&Array.isArray(data.dogs)){S=JSON.parse(JSON.stringify(data));S.done=S.done||{};S.kennel=Object.assign(emptyState().kennel,S.kennel||{});S.transfers=S.transfers||[];S.dogs.forEach(d=>{d.health=d.health||[];d.weights=d.weights||[];d.shows=d.shows||[];d.heats=d.heats||[];d.docs=d.docs||[]});S.litters=S.litters||[];
    if(S.sample){const m={Aria:'aria',Luna:'luna',Mira:'mira',Bruno:'bruno',Nova:'nova'};S.dogs.forEach(d=>{if(!d.photoId&&m[d.name])d.photoId='smp-'+m[d.name]});
      const pm={'Roșu':'pup3','Verde':'pup1','Portocaliu':'pup2'};S.litters.forEach(L=>L.puppies.forEach(p=>{if(!p.photoId&&pm[p.collar]&&dogById(L.damId)?.name==='Luna')p.photoId='smp-'+pm[p.collar]}))}}else if(dirty)Store.flush()}catch(e){console.warn(e)}
  setSync(data?'ok':'');
  try{if(pendingCode&&S.account){ui.locked=false;render();claimForm(pendingCode)}else render()}catch(e){console.error(e);ui.locked=false;ui.view='home';try{render()}catch(_){}}
  if(Store.offline)toast('Nu am putut încărca datele din cont. Lucrezi pe acest dispozitiv.');
  refreshTransfers().catch(()=>{})}
Store.init().then(boot,e=>{console.warn(e);boot(null)});
setTimeout(()=>{if(!booted){Store.mode='local';Store.col=null;Store.db=null;Store.offline=true;let d=null;try{const r=localStorage.getItem('afix-state');if(r)d=JSON.parse(r)}catch(e){}boot(d)}},20000);
</script>
